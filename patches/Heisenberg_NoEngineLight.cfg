// ModuleManager patch to strip Engine Lighting / Waterfall glow from Wild Blue fan props.
// Copy this file into GameData/Z_WBI_Patches/ (or any GameData folder) before loading KSP.
// Requires ModuleManager.

@PART[*]:HAS[#manufacturer[*Wild Blue*],@MODULE[ModuleEngineLighting]]:FINAL
{
    !MODULE[ModuleEngineLighting],* {}
}

@PART[*]:HAS[#manufacturer[*Wild Blue*],@MODULE[ModuleWaterfallFX]]:FINAL
{
    @MODULE[ModuleWaterfallFX]
    {
        !TEMPLATE,*:HAS[#templateName[*engine-light*]] {}
        !CONTROLLER,*:HAS[#name[*light*]] {}
    }
}
